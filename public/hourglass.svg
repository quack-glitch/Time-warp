<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Frame -->
  <path d="M 22 15 L 78 15 M 22 85 L 78 85" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Glass Contour -->
  <path d="M 25 15 C 75 15, 60 46, 52 50 C 60 54, 75 85, 25 85 M 75 15 C 25 15, 40 46, 48 50 C 40 54, 25 85, 75 85" 
        stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" fill="none" />
        
  <!-- Flowing Sand Stream -->
  <line x1="50" y1="46" x2="50" y2="78" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)" />
  
  <!-- Upper Sand Level -->
  <path d="M 32 30 Q 50 42 68 30 L 62 46 Q 50 48 38 46 Z" fill="url(#goldGrad)" opacity="0.9" />
  
  <!-- Lower Sand Dune -->
  <path d="M 30 83 Q 50 68 70 83 Z" fill="url(#goldGrad)" opacity="0.9" />
</svg>
